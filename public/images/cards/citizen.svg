<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <radialGradient id="citizenGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#07070a" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#785c1a" />
    </linearGradient>
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" fill="url(#citizenGlow)" />

  <!-- Victorian Inner Border -->
  <rect x="40" y="40" width="720" height="1120" rx="20" fill="none" stroke="url(#goldBorder)" stroke-width="6" opacity="0.9" />
  <rect x="55" y="55" width="690" height="1090" rx="14" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="10 5" opacity="0.6" />

  <!-- Corner Filigree Ornaments -->
  <path d="M 60 120 C 60 70 70 60 120 60 L 90 90 Z" fill="url(#goldBorder)" />
  <path d="M 740 120 C 740 70 730 60 680 60 L 710 90 Z" fill="url(#goldBorder)" />
  <path d="M 60 1080 C 60 1130 70 1140 120 1140 L 90 1110 Z" fill="url(#goldBorder)" />
  <path d="M 740 1080 C 740 1130 730 1140 680 1140 L 710 1110 Z" fill="url(#goldBorder)" />

  <!-- Window Blinds & Rain Scene -->
  <g opacity="0.35">
    <line x1="150" y1="200" x2="650" y2="200" stroke="#94a3b8" stroke-width="8" />
    <line x1="150" y1="260" x2="650" y2="260" stroke="#94a3b8" stroke-width="8" />
    <line x1="150" y1="320" x2="650" y2="320" stroke="#94a3b8" stroke-width="8" />
    <line x1="150" y1="380" x2="650" y2="380" stroke="#94a3b8" stroke-width="8" />
    <line x1="150" y1="440" x2="650" y2="440" stroke="#94a3b8" stroke-width="8" />
    <line x1="150" y1="500" x2="650" y2="500" stroke="#94a3b8" stroke-width="8" />
    <polygon points="200,180 600,180 700,850 100,850" fill="url(#windowLight)" />
  </g>

  <!-- Citizen Silhouette Looking Anxiously -->
  <g filter="url(#shadow)">
    <!-- Coat / Shoulders -->
    <path d="M 230 850 Q 210 690 300 580 Q 330 540 400 540 Q 470 540 500 580 Q 590 690 570 850 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <path d="M 340 610 L 400 680 L 460 610 L 400 570 Z" fill="#1e293b" stroke="#d4af37" stroke-width="1.5" />
    <!-- Head -->
    <ellipse cx="400" cy="460" rx="85" ry="105" fill="#1e293b" />
    <!-- Hair & Cap -->
    <path d="M 290 420 Q 400 370 510 420 Q 530 425 480 395 Q 430 365 400 365 Q 370 365 320 395 Q 270 425 290 420 Z" fill="#0b0f19" stroke="url(#goldBorder)" stroke-width="2" />
    <!-- Vigilant Anxious Eyes in the Shadows -->
    <ellipse cx="370" cy="465" rx="14" ry="9" fill="#f8fafc" />
    <ellipse cx="430" cy="465" rx="14" ry="9" fill="#f8fafc" />
    <circle cx="370" cy="465" r="5" fill="#0284c7" />
    <circle cx="430" cy="465" r="5" fill="#0284c7" />
    <circle cx="368" cy="463" r="2" fill="#fff" />
    <circle cx="428" cy="463" r="2" fill="#fff" />
  </g>

  <!-- Town Crest / Shield in Forefront -->
  <g filter="url(#shadow)" transform="translate(400, 780)">
    <path d="M 0 -70 L 60 -40 L 60 20 Q 60 70 0 100 Q -60 70 -60 20 L -60 -40 Z" fill="#0369a1" stroke="url(#goldBorder)" stroke-width="5" />
    <!-- Balance & Torch inside shield -->
    <path d="M 0 -40 L 0 50 M -25 -10 L 25 -10" stroke="#fde68a" stroke-width="4" stroke-linecap="round" />
    <circle cx="0" cy="-45" r="8" fill="#fbbf24" />
  </g>

  <!-- Title Plate -->
  <g transform="translate(400, 1030)">
    <rect x="-240" y="-40" width="480" height="80" rx="10" fill="#0b1329" stroke="url(#goldBorder)" stroke-width="3" />
    <text x="0" y="2" text-anchor="middle" font-family="'Cairo', sans-serif" font-weight="bold" font-size="34" fill="#fbbf24">المواطن</text>
    <text x="0" y="28" text-anchor="middle" font-family="'Cinzel', serif" font-weight="600" font-size="16" letter-spacing="4" fill="#d4af37">THE CITIZEN</text>
  </g>
</svg>

