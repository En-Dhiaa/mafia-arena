<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <radialGradient id="judgeGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="60%" stop-color="#1e053a" />
      <stop offset="100%" stop-color="#07070a" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#785c1a" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" fill="url(#judgeGlow)" />

  <!-- Victorian Inner Border -->
  <rect x="40" y="40" width="720" height="1120" rx="20" fill="none" stroke="url(#goldBorder)" stroke-width="6" opacity="0.9" />
  <rect x="55" y="55" width="690" height="1090" rx="14" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="10 5" opacity="0.6" />

  <!-- Corner Filigree Ornaments -->
  <path d="M 60 120 C 60 70 70 60 120 60 L 90 90 Z" fill="url(#goldBorder)" />
  <path d="M 740 120 C 740 70 730 60 680 60 L 710 90 Z" fill="url(#goldBorder)" />
  <path d="M 60 1080 C 60 1130 70 1140 120 1140 L 90 1110 Z" fill="url(#goldBorder)" />
  <path d="M 740 1080 C 740 1130 730 1140 680 1140 L 710 1110 Z" fill="url(#goldBorder)" />

  <!-- Scales of Justice in Background -->
  <g opacity="0.35" transform="translate(400, 360)">
    <line x1="0" y1="-120" x2="0" y2="180" stroke="url(#goldBorder)" stroke-width="8" />
    <line x1="-160" y1="-80" x2="160" y2="-80" stroke="url(#goldBorder)" stroke-width="8" />
    <path d="M -160 -80 L -210 10 L -110 10 Z" fill="none" stroke="#fde68a" stroke-width="3" />
    <path d="M -210 10 Q -160 50 -110 10 Z" fill="#d4af37" opacity="0.6" />
    <path d="M 160 -80 L 110 10 L 210 10 Z" fill="none" stroke="#fde68a" stroke-width="3" />
    <path d="M 110 10 Q 160 50 210 10 Z" fill="#d4af37" opacity="0.6" />
  </g>

  <!-- Judge Silhouette in Robes -->
  <g filter="url(#shadow)">
    <!-- Robes & Collar -->
    <path d="M 210 850 Q 190 670 290 540 Q 330 500 400 500 Q 470 500 510 540 Q 610 670 590 850 Z" fill="#120422" stroke="#9333ea" stroke-width="2" />
    <path d="M 330 560 L 400 680 L 470 560 L 400 530 Z" fill="#f8fafc" stroke="#d4af37" stroke-width="1.5" />
    <!-- Judge Head & Wig/Hair -->
    <ellipse cx="400" cy="440" rx="90" ry="110" fill="#2d0b4e" />
    <path d="M 290 440 Q 300 340 400 340 Q 500 340 510 440 Q 530 500 500 540 Q 460 480 400 480 Q 340 480 300 540 Z" fill="#e2e8f0" stroke="url(#goldBorder)" stroke-width="2" />
    <!-- Solemn Piercing Eyes -->
    <ellipse cx="370" cy="450" rx="12" ry="7" fill="#f8fafc" />
    <ellipse cx="430" cy="450" rx="12" ry="7" fill="#f8fafc" />
    <circle cx="370" cy="450" r="5" fill="#9333ea" />
    <circle cx="430" cy="450" r="5" fill="#9333ea" />
  </g>

  <!-- Wooden Gavel in Forefront -->
  <g filter="url(#shadow)" transform="translate(400, 780)">
    <!-- Sound Block -->
    <ellipse cx="0" cy="60" rx="100" ry="30" fill="#3f1d0b" stroke="url(#goldBorder)" stroke-width="4" />
    <rect x="-80" y="45" width="160" height="25" fill="#582a10" />
    <!-- Gavel Head & Handle -->
    <g transform="rotate(-25, 0, 0)">
      <rect x="-12" y="-120" width="24" height="150" rx="6" fill="#78350f" stroke="url(#goldBorder)" stroke-width="3" />
      <rect x="-60" y="-160" width="120" height="50" rx="10" fill="#451a03" stroke="url(#goldBorder)" stroke-width="4" />
      <rect x="-55" y="-155" width="110" height="10" fill="#d4af37" />
    </g>
  </g>

  <!-- Title Plate -->
  <g transform="translate(400, 1030)">
    <rect x="-240" y="-40" width="480" height="80" rx="10" fill="#1b0730" stroke="url(#goldBorder)" stroke-width="3" />
    <text x="0" y="2" text-anchor="middle" font-family="'Cairo', sans-serif" font-weight="bold" font-size="34" fill="#fbbf24">الحكم</text>
    <text x="0" y="28" text-anchor="middle" font-family="'Cinzel', serif" font-weight="600" font-size="16" letter-spacing="4" fill="#d4af37">THE ARBITER</text>
  </g>
</svg>

