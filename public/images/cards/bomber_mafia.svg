<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="60%" stop-color="#180404" />
      <stop offset="100%" stop-color="#07070a" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#785c1a" />
    </linearGradient>
    <linearGradient id="fuseFire" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" fill="url(#bgGlow)" />

  <!-- Victorian Inner Border -->
  <rect x="40" y="40" width="720" height="1120" rx="20" fill="none" stroke="url(#goldBorder)" stroke-width="6" opacity="0.9" />
  <rect x="55" y="55" width="690" height="1090" rx="14" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="10 5" opacity="0.6" />

  <!-- Corner Filigree Ornaments -->
  <path d="M 60 120 C 60 70 70 60 120 60 L 90 90 Z" fill="url(#goldBorder)" />
  <path d="M 740 120 C 740 70 730 60 680 60 L 710 90 Z" fill="url(#goldBorder)" />
  <path d="M 60 1080 C 60 1130 70 1140 120 1140 L 90 1110 Z" fill="url(#goldBorder)" />
  <path d="M 740 1080 C 740 1130 730 1140 680 1140 L 710 1110 Z" fill="url(#goldBorder)" />

  <!-- Character Silhouette: Bomber Mobster -->
  <g filter="url(#shadow)">
    <!-- Shadowed Coat / Body -->
    <path d="M 240 850 Q 200 680 290 560 Q 320 520 400 520 Q 480 520 510 560 Q 600 680 560 850 Z" fill="#1c0707" stroke="#dc2626" stroke-width="2" />
    <path d="M 330 600 L 400 690 L 470 600 L 400 560 Z" fill="#2d0a0a" stroke="#d4af37" stroke-width="1.5" />
    <!-- Menacing Head & Fedora -->
    <ellipse cx="400" cy="460" rx="90" ry="110" fill="#2b1111" />
    <!-- Fedora Hat -->
    <path d="M 270 410 Q 400 370 530 410 Q 560 415 500 395 Q 430 350 400 350 Q 370 350 300 395 Q 240 415 270 410 Z" fill="#110505" stroke="url(#goldBorder)" stroke-width="2" />
    <ellipse cx="400" cy="410" rx="140" ry="25" fill="#180707" stroke="#d4af37" stroke-width="2" />
    <rect x="330" y="380" width="140" height="20" fill="#991b1b" />
    <!-- Glowing Red Sinister Eyes -->
    <ellipse cx="370" cy="465" rx="12" ry="6" fill="#ef4444" />
    <ellipse cx="430" cy="465" rx="12" ry="6" fill="#ef4444" />
    <circle cx="370" cy="465" r="3" fill="#fff" />
    <circle cx="430" cy="465" r="3" fill="#fff" />
  </g>

  <!-- Dynamite Bundle & Ticking Clock in Forefront -->
  <g filter="url(#shadow)" transform="translate(400, 780)">
    <!-- Dynamite Sticks -->
    <rect x="-90" y="-70" width="40" height="150" rx="8" fill="#b91c1c" stroke="#450a0a" stroke-width="3" />
    <rect x="-50" y="-80" width="40" height="160" rx="8" fill="#dc2626" stroke="#450a0a" stroke-width="3" />
    <rect x="-10" y="-80" width="40" height="160" rx="8" fill="#ef4444" stroke="#450a0a" stroke-width="3" />
    <rect x="30" y="-70" width="40" height="150" rx="8" fill="#b91c1c" stroke="#450a0a" stroke-width="3" />
    <!-- Strapping bands with hazard pattern -->
    <rect x="-95" y="-45" width="170" height="20" fill="#000" stroke="#f59e0b" stroke-width="2" />
    <rect x="-95" y="30" width="170" height="20" fill="#000" stroke="#f59e0b" stroke-width="2" />
    <!-- Brass Clockwork Mechanism -->
    <circle cx="-10" cy="0" r="45" fill="#241b07" stroke="url(#goldBorder)" stroke-width="5" />
    <circle cx="-10" cy="0" r="38" fill="#fffbeb" />
    <!-- Clock Hands at 11:59 -->
    <line x1="-10" y1="0" x2="-10" y2="-28" stroke="#000" stroke-width="4" stroke-linecap="round" />
    <line x1="-10" y1="0" x2="-2" y2="-24" stroke="#dc2626" stroke-width="3" stroke-linecap="round" />
    <circle cx="-10" cy="0" r="5" fill="#d4af37" />
    <!-- Burning Fuse Wire -->
    <path d="M -30 -80 Q -40 -130 -10 -150 Q 20 -170 10 -200" fill="none" stroke="#d4af37" stroke-width="4" />
    <!-- Fuse Sparks & Flame -->
    <circle cx="10" cy="-200" r="18" fill="url(#fuseFire)" filter="url(#shadow)" />
    <circle cx="10" cy="-200" r="8" fill="#fff" />
  </g>

  <!-- Title Plate -->
  <g transform="translate(400, 1030)">
    <rect x="-240" y="-40" width="480" height="80" rx="10" fill="#130404" stroke="url(#goldBorder)" stroke-width="3" />
    <text x="0" y="2" text-anchor="middle" font-family="'Cairo', sans-serif" font-weight="bold" font-size="34" fill="#fbbf24">مافيا القنبلة</text>
    <text x="0" y="28" text-anchor="middle" font-family="'Cinzel', serif" font-weight="600" font-size="16" letter-spacing="4" fill="#d4af37">THE BOMBER</text>
  </g>
</svg>

